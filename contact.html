```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact Your Name using the accessible portfolio contact form."
    >

    <meta name="author" content="Your Name">

    <meta name="robots" content="index, follow">

    <title>Contact | Your Name</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


    <header class="site-header">

        <div class="container">

            <a class="logo" href="index.html">
                Your Name
            </a>


            <nav aria-label="Main navigation">

                <ul class="navigation">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main id="main-content">

        <section
            class="page-header"
            aria-labelledby="page-title"
        >

            <div class="container">

                <h1 id="page-title">
                    Contact Me
                </h1>

                <p>
                    Have a question or want to work together?
                    Send me a message.
                </p>

            </div>

        </section>


        <section
            class="contact-section"
            aria-labelledby="contact-heading"
        >

            <div class="container">

                <h2 id="contact-heading">
                    Send a Message
                </h2>


                <form
                    class="contact-form"
                    action="#"
                    method="post"
                >


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        >

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true"
                        >

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Your Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"
                        ></textarea>

                    </div>


                    <button type="submit" class="button">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Your Name. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
```
